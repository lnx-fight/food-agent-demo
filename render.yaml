services:
  - type: web
    name: xiaofan-demo
    runtime: node
    region: singapore
    # 账号和SQLite记录必须保存在持久磁盘；此配置需要付费实例。
    plan: starter
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: xiaofan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: AMAP_WEB_SERVICE_KEY
        sync: false
      - key: QWEN_VISION_MODEL
        value: qwen3-vl-flash
      - key: QWEN_WEB_MODEL
        value: qwen-plus
      - key: QWEN_CHAT_MODEL
        value: qwen-plus
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_EMBED_MODEL
        value: text-embedding-v3
      - key: AGENT_MAX_TOOL_ROUNDS
        value: "6"
